[project]
name = "hostwatch"
version = "0.0.1"
description = "Telegram bot that watches servers and balances across hosting providers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.13,<4",
    # SOCKS proxies for TG_PROXY.
    "aiohttp-socks",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "cryptography",
    "segno",
    # Time zone database; Windows has none of its own.
    "tzdata",
    # Must match the `browser` image tag in docker-compose.yml.
    "playwright==1.64.1",
    # HTML parsing for cabinets without an API (AdminVPS).
    "selectolax>=1.0.2",
]

[project.scripts]
hostwatch = "hostwatch.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hostwatch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Russian texts use Cyrillic letters that look like Latin ones on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
