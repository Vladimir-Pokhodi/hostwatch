# install.sh puts this file into /opt/hostwatch next to .env and Caddyfile.
# Update: docker compose pull && docker compose up -d
# Build from a checkout instead of pulling:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# The data folder must belong to the container user: mkdir -p data && chown 10001:10001 data

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  hostwatch:
    # HOSTWATCH_VERSION in .env pins a release, e.g. 1.0.0. The default follows 1.x.
    image: ghcr.io/vladimir-pokhodi/hostwatch:${HOSTWATCH_VERSION:-1}
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    networks: [web, browser]
    depends_on:
      - browser
    logging: *logging

  # Chromium for browser login (spec, decision 2). Starts a browser only while someone
  # logs in. No ports outside, no access to /data or the keys.
  browser:
    # The tag must match `playwright` in pyproject.toml.
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    restart: unless-stopped
    init: true
    user: pwuser
    working_dir: /home/pwuser
    command: ["npx", "-y", "playwright@1.64.1", "run-server", "--port", "3000", "--host", "0.0.0.0"]
    networks: [browser]
    mem_limit: 1200m
    logging: *logging

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # The login page and Mini App address: the domain if there is one, else the server IP.
      SITE_ADDRESS: ${HOSTWATCH_DOMAIN:-${HOSTWATCH_IP:?set HOSTWATCH_IP or HOSTWATCH_DOMAIN in .env}}
      # A domain gets the usual certificate; an IP the 6-day one (see Caddyfile).
      SITE_CERT: shortlived${HOSTWATCH_DOMAIN:+-off}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    depends_on:
      - hostwatch
    logging: *logging

networks:
  # caddy <-> hostwatch
  web:
  # hostwatch <-> browser; the browser reaches the internet, not caddy.
  browser:

volumes:
  caddy_data:
  caddy_config:
